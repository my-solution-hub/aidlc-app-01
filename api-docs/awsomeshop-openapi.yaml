            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultProductDTO'
  /product/api/internal/products/deduct-stock:
    post:
      tags:
      - Product
      summary: 扣减库存（内部，兑换调用）
      operationId: deductStock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_StockRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
