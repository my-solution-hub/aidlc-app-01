  /product/api/files/upload:
    post:
      tags:
      - product:product:File
      summary: 上传文件（仅图片）
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultFileUploadResponse'
  /product/api/admin/products:
    post:
      tags:
      - product:product:Product
      summary: 创建商品
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_CreateProductRequest'
