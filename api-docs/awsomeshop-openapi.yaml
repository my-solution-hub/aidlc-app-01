          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_UpdateProductStatusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultProductDTO'
  /product/api/admin/categories/{id}/status:
    patch:
      tags:
      - product:product:Category
      summary: 更新类目状态（启用/禁用）
      operationId: updateStatus_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_UpdateCategoryStatusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultCategoryDTO'
  /product/api/products:
    get:
      tags:
      - product:product:Product
      summary: 商品列表查询（分页 / 过滤）
      operationId: list
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Product_ListProductRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultPageResultProductDTO'
  /product/api/products/{id}:
    get:
      tags:
      - product:product:Product
      summary: 商品详情查询
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
