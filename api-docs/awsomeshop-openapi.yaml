openapi: 3.0.1
info:
  title: AWSomeShop 统一 API（经网关）
  description: 所有微服务经 API 网关统一访问。路径前缀：/auth /product /point /order，网关 StripPrefix
    后转发到对应服务。统一响应信封 Result<T>。
  version: 1.0.0
servers:
- url: http://localhost:8088
  description: API Gateway
tags:
- name: auth:InternalAuth
  description: 内部认证（网关校验）
- name: auth:User
  description: 用户管理（管理员）
- name: auth:Auth
  description: 用户认证（登录/登出/注册/当前用户）
- name: product:Product
  description: 商品管理
- name: product:File
  description: 文件上传与访问
- name: product:Category
  description: 类目管理
- name: point:PointAccount
  description: 积分账户
- name: point:PointRule
  description: 积分规则管理
- name: point:PointConfig
  description: 积分发放配置
- name: order:ExchangeRecord
  description: 积分兑换记录管理
paths:
  /auth/api/admin/users/{id}:
    get:
      tags:
      - auth:auth:User
      summary: 查询用户详情
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
    put:
      tags:
      - auth:auth:User
      summary: 更新用户信息（昵称/角色/工号）
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_UpdateUserRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/internal/auth/validate:
    post:
      tags:
      - auth:auth:InternalAuth
      summary: 校验 Token（网关调用）
      operationId: validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_ValidateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ValidateResponse'
  /auth/api/auth/register:
    post:
      tags:
      - auth:auth:Auth
      summary: 用户注册
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/auth/logout:
    post:
      tags:
      - auth:auth:Auth
      summary: 用户登出
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultVoid'
  /auth/api/auth/login:
    post:
      tags:
      - auth:auth:Auth
      summary: 用户登录
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultLoginResponse'
  /auth/api/admin/users:
    get:
      tags:
      - auth:auth:User
      summary: 用户列表分页查询
      operationId: list
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Auth_ListUserRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultPageResultUserDTO'
    post:
      tags:
      - auth:auth:User
      summary: 创建用户（管理员）
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_CreateUserRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/admin/users/{id}/status:
    patch:
      tags:
      - auth:auth:User
      summary: 更新用户状态（启用/禁用）
      operationId: updateStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_UpdateUserStatusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/users/me:
    get:
      tags:
      - auth:auth:Auth
      summary: 获取当前登录用户信息
      operationId: me
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: X-Operator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /product/api/admin/products/{id}:
    put:
      tags:
      - product:product:Product
      summary: 更新商品
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_UpdateProductRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultProductDTO'
    delete:
      tags:
      - product:product:Product
      summary: 删除商品
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultVoid'
  /product/api/admin/categories/{id}:
    put:
      tags:
      - product:product:Category
      summary: 更新类目
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_UpdateCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultCategoryDTO'
    delete:
      tags:
      - product:product:Category
      summary: 删除类目
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultVoid'
  /product/api/internal/products/restore-stock:
    post:
      tags:
      - product:product:Product
      summary: 回补库存（内部，Saga 补偿调用）
      operationId: restoreStock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_StockRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
