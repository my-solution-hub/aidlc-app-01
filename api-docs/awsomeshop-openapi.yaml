  /product/api/files/upload:
    post:
      tags:
      - File
      summary: 上传文件（仅图片）
      operationId: upload
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - file
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultFileUploadResponse'
  /product/api/admin/products:
    post:
      tags:
      - Product
      summary: 创建商品
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_CreateProductRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultProductDTO'
  /product/api/admin/products/{id}/stock:
    post:
      tags:
      - Product
      summary: 管理员调整库存 (入库IN/出库OUT) 并记录
      operationId: adjustStock
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: changeType
        in: query
        required: true
        schema:
          type: string
      - name: quantity
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: reason
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultProductDTO'
  /product/api/admin/products/batch:
    post:
      tags:
      - Product Batch
      summary: 批量导入产品（最多100条）
      operationId: batchImport
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Product_CreateProductRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultMapStringObject'
  /product/api/admin/categories:
    post:
      tags:
      - Category
      summary: 创建类目
      operationId: create_2
      requestBody:
        content:
          application/json:
            schema:
