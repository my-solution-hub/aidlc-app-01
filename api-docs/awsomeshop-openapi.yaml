  /order/api/orders/{id}:
    get:
      tags:
      - order:order:ExchangeRecord
      summary: 员工查询兑换记录详情
      operationId: getMine
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Order_ResultExchangeRecordDTO'
  /order/api/admin/orders:
    get:
      tags:
      - order:order:ExchangeRecord
      summary: 分页查询兑换记录
      operationId: list
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Order_ListExchangeRecordRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Order_ResultPageResultExchangeRecordDTO'
  /order/api/admin/orders/{id}:
    get:
      tags:
      - order:order:ExchangeRecord
      summary: 查询兑换记录详情
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
