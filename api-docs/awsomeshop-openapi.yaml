openapi: 3.0.1
info:
  title: AWSomeShop 统一网关 API
  description: 4服务合并,路径含网关前缀。v1.2 含设计稿缺口补齐
  version: '1.2'
servers:
- url: http://localhost:8088
  description: Gateway(本地)
paths:
  /auth/api/auth/password:
    put:
      tags:
      - Auth
      summary: 修改密码 (AUTH-3)
      operationId: changePassword
      parameters:
      - name: X-Operator-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultVoid'
  /auth/api/admin/users/{id}:
    get:
      tags:
      - User
      summary: 查询用户详情
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
    put:
      tags:
      - User
      summary: 更新用户信息（昵称/角色/工号）
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_UpdateUserRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/internal/auth/validate:
    post:
      tags:
      - InternalAuth
      summary: 校验 Token（网关调用）
      operationId: validate
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_ValidateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ValidateResponse'
  /auth/api/auth/register:
    post:
      tags:
      - Auth
      summary: 用户注册
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/auth/refresh:
    post:
      tags:
      - Auth
      summary: 刷新 Token (AUTH-6)
      operationId: refreshToken
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultLoginResponse'
  /auth/api/auth/logout:
    post:
      tags:
      - Auth
      summary: 用户登出
      operationId: logout
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultVoid'
  /auth/api/auth/login:
    post:
      tags:
      - Auth
      summary: 用户登录
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultLoginResponse'
  /auth/api/admin/users:
    get:
      tags:
      - User
      summary: 用户列表分页查询
      operationId: list
      parameters:
      - name: request
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Auth_ListUserRequest'
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultPageResultUserDTO'
    post:
      tags:
      - User
      summary: 创建用户（管理员）
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_CreateUserRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/admin/users/{id}/status:
    patch:
      tags:
      - User
      summary: 更新用户状态（启用/禁用）
      operationId: updateStatus
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Auth_UpdateUserStatusRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/users/me:
    get:
      tags:
      - Auth
      summary: 获取当前登录用户信息
      operationId: me
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: X-Operator-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserDTO'
  /auth/api/admin/users/stats:
    get:
      tags:
      - User
      summary: 用户统计（总数/活跃/本月新增）
      operationId: stats
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Auth_ResultUserStatsDTO'
  /auth/api/admin/users/export:
    get:
      tags:
      - User
      summary: 导出用户数据 CSV
      operationId: export
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
  /product/api/admin/products/{id}:
    put:
      tags:
      - Product
      summary: 更新商品
      operationId: update
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_UpdateProductRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultProductDTO'
    delete:
      tags:
      - Product
      summary: 删除商品
      operationId: delete
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultVoid'
  /product/api/admin/categories/{id}:
    put:
      tags:
      - Category
      summary: 更新类目
      operationId: update_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_UpdateCategoryRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultCategoryDTO'
    delete:
      tags:
      - Category
      summary: 删除类目
      operationId: delete_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultVoid'
  /product/api/wishlist:
    get:
      tags:
      - wishlist-controller
      summary: 我的心愿单
      operationId: list
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
