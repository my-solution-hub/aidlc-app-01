          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Order_ResultExchangeRecordStatsDTO'
components:
  schemas:
    Auth_UpdateUserRequest:
      required:
      - userId
      type: object
      properties:
        userId:
          type: integer
          format: int64
        nickname:
          type: string
        role:
          type: string
        employeeId:
          type: string
    Auth_ResultUserDTO:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/Auth_UserDTO'
    Auth_UserDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        nickname:
          type: string
        employeeId:
          type: string
        role:
          type: string
        status:
          type: string
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Auth_ValidateRequest:
      type: object
      properties:
        token:
          type: string
    Auth_ValidateResponse:
      type: object
      properties:
        success:
          type: boolean
        operatorId:
          type: string
        role:
          type: string
        message:
          type: string
    Auth_RegisterRequest:
      required:
      - password
      - username
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        nickname:
          type: string
        employeeId:
          type: string
        role:
