            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultListProductDTO'
    post:
      tags:
      - wishlist-controller
      summary: 加入心愿单
      operationId: add
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: productId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultVoid'
    delete:
      tags:
      - wishlist-controller
      summary: 移出心愿单
      operationId: remove
      parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      - name: productId
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultVoid'
  /product/api/products/{id}/reviews:
    get:
      tags:
      - review-controller
      summary: 商品评价列表(PUBLIC)
      operationId: list_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultListReviewDTO'
    post:
      tags:
      - review-controller
      summary: 提交商品评价(登录)
      operationId: create
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_CreateReviewRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Product_ResultReviewDTO'
  /product/api/internal/products/restore-stock:
    post:
      tags:
      - Product
      summary: 回补库存（内部，Saga 补偿调用）
      operationId: restoreStock
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product_StockRequest'
        required: true
      responses:
        '200':
