# Production Environment Configuration (EKS)
# 生产环境配置 - Auth Service

# 说明:
# - 部署在 EKS，DB / Redis 通过 K8s Secret 与 ConfigMap 注入
# - SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
#   由 deployment.yaml 从 auth-db-secret 注入（覆盖 spring.datasource 下面的占位）
# - SPRING_DATA_REDIS_HOST / SPRING_DATA_REDIS_PORT 由 deployment.yaml 从 shared-config 注入
# - JWT_SECRET / ENCRYPTION_KEY 当前用 dev 默认值便于跑通；正式环境需通过 env 覆盖

server:
  port: 8001

spring:
  # Redis 配置 (host/port 由 env 注入)
  # ElastiCache Serverless (Redis 7.x) 强制 in-transit TLS
  data:
    redis:
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: true
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 5000ms

  # 数据源 (url/username/password 由 env 注入)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 10
      min-idle: 5
      max-active: 50
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

# 日志配置
logging:
  level:
    root: INFO
    com.awsome: INFO

# Security 配置
security:
  jwt:
    secret: ${JWT_SECRET:awsomeshop-prod-jwt-secret-change-me-must-be-at-least-256-bits-long-for-hmac-sha256}
    expiration: ${JWT_EXPIRATION:7200}
    issuer: ${JWT_ISSUER:awsome-shop-auth-service}
  login:
    max-failed-attempts: ${MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${LOCK_DURATION:1800}

# Shop 配置
shop:
  security:
    encryption:
      key: ${ENCRYPTION_KEY:awsomeshop32byteEncryptionKeyAa01}
