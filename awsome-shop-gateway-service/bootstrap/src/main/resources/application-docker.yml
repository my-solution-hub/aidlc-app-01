# Docker Environment Configuration
# 容器化部署环境配置

server:
  port: 8081

spring:
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      database: 0

  # 数据源配置
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:awsome_shop_gateway}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource

    # Druid 连接池配置 (生产环境调优)
    druid:
      initial-size: 10
      min-idle: 5
      max-active: 50
      max-wait: 60000
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      validation-query: SELECT 1
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000

      # 禁用 Druid 监控 (生产环境)
      stat-view-servlet:
        enabled: false

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      banner: false

# Security 配置
security:
  jwt:
    secret: ${JWT_SECRET:docker-secret-key-for-jwt-token-must-be-at-least-256-bits-long-for-hmac-sha256}
    expiration: ${JWT_EXPIRATION:7200}
    issuer: awsome-shop-gateway-service
  login:
    max-failed-attempts: 5
    lock-duration: 1800

# Shop 配置
shop:
  security:
    encryption:
      key: ${ENCRYPTION_KEY:dockerEncryptionKey1234567890ab}

# 日志配置
logging:
  level:
    root: INFO
    com.awsome: INFO

# ==================== Gateway routing (docker) ====================
# Spring Cloud Gateway routes are a list structure and cannot be supplied
# purely via env vars, so they are defined here for the docker profile.
# Backend service base URLs default to the compose service hostnames on the
# internal container port (8081) and can be overridden via env, e.g.
# GATEWAY_SERVICES_AUTH, GATEWAY_AUTH_VALIDATE_URL.
gateway:
  services:
    auth: ${GATEWAY_SERVICES_AUTH:http://auth-service:8081}
    product: ${GATEWAY_SERVICES_PRODUCT:http://product-service:8081}
    point: ${GATEWAY_SERVICES_POINT:http://points-service:8081}
    order: ${GATEWAY_SERVICES_ORDER:http://order-service:8081}
  auth:
    validate-url: ${GATEWAY_AUTH_VALIDATE_URL:http://auth-service:8081/api/internal/auth/validate}

spring.cloud.gateway.server.webflux.routes:
  # ---- API Docs ----
  - id: auth-docs
    uri: ${gateway.services.auth}
    predicates:
      - Path=/v3/api-docs/auth
    filters:
      - RewritePath=/v3/api-docs/auth, /v3/api-docs
      - SwaggerServersRewrite
    metadata:
      auth-required: false
  - id: product-docs
    uri: ${gateway.services.product}
    predicates:
      - Path=/v3/api-docs/product
    filters:
      - RewritePath=/v3/api-docs/product, /v3/api-docs
      - SwaggerServersRewrite
    metadata:
      auth-required: false
  - id: point-docs
    uri: ${gateway.services.point}
    predicates:
      - Path=/v3/api-docs/point
    filters:
      - RewritePath=/v3/api-docs/point, /v3/api-docs
      - SwaggerServersRewrite
    metadata:
      auth-required: false
  - id: order-docs
    uri: ${gateway.services.order}
    predicates:
      - Path=/v3/api-docs/order
    filters:
      - RewritePath=/v3/api-docs/order, /v3/api-docs
      - SwaggerServersRewrite
    metadata:
      auth-required: false
  # ---- Public REST (no auth) ----
  # Most specific public paths first so they win over the authenticated
  # per-service routes below (gateway evaluates routes in order).
  - id: auth-public
    uri: ${gateway.services.auth}
    predicates:
      - Path=/api/auth/login,/api/auth/register,/api/auth/logout
    metadata:
      auth-required: false
  - id: product-public
    uri: ${gateway.services.product}
    predicates:
      - Path=/api/products/**,/api/categories/**,/api/files/**
      - Method=GET
    metadata:
      auth-required: false
  # ---- Authenticated REST (auth required) ----
  # Grouped by target service using the most-specific prefix per service.
  # Admin routes (/api/admin/**) only need auth-required: true; the
  # AuthenticationGatewayFilter enforces role==ADMIN via the "/admin/"
  # path segment.
  - id: auth-service
    uri: ${gateway.services.auth}
    predicates:
      - Path=/api/users/**,/api/admin/users/**
    metadata:
      auth-required: true
  - id: product-service
    uri: ${gateway.services.product}
    predicates:
      - Path=/api/products/**,/api/categories/**,/api/files/**,/api/admin/products/**,/api/admin/categories/**
    metadata:
      auth-required: true
  - id: points-service
    uri: ${gateway.services.point}
    predicates:
      - Path=/api/points/**,/api/admin/points/**,/api/admin/point-rules/**
    metadata:
      auth-required: true
  - id: order-service
    uri: ${gateway.services.order}
    predicates:
      - Path=/api/orders/**,/api/admin/orders/**
    metadata:
      auth-required: true
  # ---- Service-prefix routes (used by frontend & Swagger: /auth, /product, /point, /order) ----
  # IMPORTANT: these mirror the auth policy of the REST routes above. Public
  # routes are declared BEFORE the catch-all authenticated proxy per service
  # (gateway matches in order). The auth filter reads the ORIGINAL path (before
  # StripPrefix), so "/auth/api/admin/..." still triggers the admin-role check.
  # ---- auth ----
  - id: auth-proxy-public
    uri: ${gateway.services.auth}
    predicates:
      - Path=/auth/api/auth/login,/auth/api/auth/register,/auth/api/auth/logout,/auth/api/internal/**
    filters:
      - StripPrefix=1
    metadata:
      auth-required: false
  - id: auth-proxy
    uri: ${gateway.services.auth}
    predicates:
      - Path=/auth/**
    filters:
      - StripPrefix=1
    metadata:
      auth-required: true
  # ---- product ----
  - id: product-proxy-public
    uri: ${gateway.services.product}
    predicates:
      - Path=/product/api/products/**,/product/api/categories/**,/product/api/files/**
      - Method=GET
    filters:
      - StripPrefix=1
    metadata:
      auth-required: false
  - id: product-proxy-internal
    uri: ${gateway.services.product}
    predicates:
      - Path=/product/api/internal/**
    filters:
      - StripPrefix=1
    metadata:
      auth-required: false
  - id: product-proxy
    uri: ${gateway.services.product}
    predicates:
      - Path=/product/**
    filters:
      - StripPrefix=1
    metadata:
      auth-required: true
  # ---- point ----
  - id: point-proxy-internal
    uri: ${gateway.services.point}
    predicates:
      - Path=/point/api/internal/**
    filters:
      - StripPrefix=1
    metadata:
      auth-required: false
  - id: point-proxy
    uri: ${gateway.services.point}
    predicates:
      - Path=/point/**
    filters:
      - StripPrefix=1
    metadata:
      auth-required: true
  # ---- order ----
  - id: order-proxy
    uri: ${gateway.services.order}
    predicates:
      - Path=/order/**
    filters:
      - StripPrefix=1
    metadata:
      auth-required: true

# SpringDoc - Swagger aggregation
springdoc:
  swagger-ui:
    urls:
      - name: auth
        url: /v3/api-docs/auth
      - name: product
        url: /v3/api-docs/product
      - name: point
        url: /v3/api-docs/point
      - name: order
        url: /v3/api-docs/order
