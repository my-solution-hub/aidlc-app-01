# Local Development Environment Configuration

server:
  port: 8080

# Gateway backend service URLs
gateway:
  services:
    auth: http://localhost:8001
    product: http://localhost:8002
    point: http://localhost:8003
    order: http://localhost:8004
  auth:
    validate-url: http://localhost:8001/api/internal/auth/validate

# Rate Limiting Configuration (GW-1)
spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      # Global default filters for rate limiting
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 10
            redis-rate-limiter.burstCapacity: 20
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"
            deny-empty-key: false
      server:
        webflux:
          routes:
            # ==================== Swagger UI 便捷重定向 ====================
            # springdoc 真实入口是 /swagger-ui.html（302→/webjars/swagger-ui/index.html）。
            # 为兼容常见的 /swagger-ui/index.html 与 /swagger 访问习惯，重定向到标准入口。
            - id: swagger-ui-redirect
              uri: ${gateway.services.auth}
              predicates:
                - Path=/swagger-ui/index.html,/swagger-ui,/swagger
              filters:
                - RedirectTo=302, /swagger-ui.html
              metadata:
                auth-required: false

            # ==================== API Docs Routes ====================
            - id: auth-docs
              uri: ${gateway.services.auth}
              predicates:
                - Path=/v3/api-docs/auth
              filters:
                - RewritePath=/v3/api-docs/auth, /v3/api-docs
                - SwaggerServersRewrite
              metadata:
                auth-required: false

            - id: product-docs
              uri: ${gateway.services.product}
              predicates:
                - Path=/v3/api-docs/product
              filters:
                - RewritePath=/v3/api-docs/product, /v3/api-docs
                - SwaggerServersRewrite
              metadata:
                auth-required: false

            - id: point-docs
              uri: ${gateway.services.point}
              predicates:
                - Path=/v3/api-docs/point
              filters:
                - RewritePath=/v3/api-docs/point, /v3/api-docs
                - SwaggerServersRewrite
              metadata:
                auth-required: false

            - id: order-docs
              uri: ${gateway.services.order}
              predicates:
                - Path=/v3/api-docs/order
              filters:
                - RewritePath=/v3/api-docs/order, /v3/api-docs
                - SwaggerServersRewrite
              metadata:
                auth-required: false

            # ==================== Public REST Routes (no auth) ====================
            # Most specific public paths first so they win over the authenticated
            # per-service routes below (gateway evaluates routes in order).
            - id: auth-public
              uri: ${gateway.services.auth}
              predicates:
                - Path=/api/auth/login,/api/auth/register,/api/auth/logout
              metadata:
                auth-required: false

            - id: product-public
              uri: ${gateway.services.product}
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/files/**
                - Method=GET
              metadata:
                auth-required: false

            # ==================== Authenticated REST Routes (auth required) ====================
            # Grouped by target service using the most-specific prefix per service.
            # Admin routes (/api/admin/**) only need auth-required: true; the
            # AuthenticationGatewayFilter enforces role==ADMIN via the "/admin/"
            # path segment.
            - id: auth-service
              uri: ${gateway.services.auth}
              predicates:
                - Path=/api/users/**,/api/admin/users/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: authServiceCB
                    fallbackUri: forward:/fallback/service-unavailable
              metadata:
                auth-required: true

            - id: product-service
              uri: ${gateway.services.product}
              predicates:
                - Path=/api/products/**,/api/categories/**,/api/files/**,/api/admin/products/**,/api/admin/categories/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: productServiceCB
                    fallbackUri: forward:/fallback/service-unavailable
              metadata:
                auth-required: true

            - id: points-service
              uri: ${gateway.services.point}
              predicates:
                - Path=/api/points/**,/api/admin/points/**,/api/admin/point-rules/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: pointsServiceCB
                    fallbackUri: forward:/fallback/service-unavailable
              metadata:
                auth-required: true

            - id: order-service
              uri: ${gateway.services.order}
              predicates:
                - Path=/api/orders/**,/api/admin/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderServiceCB
                    fallbackUri: forward:/fallback/service-unavailable
              metadata:
                auth-required: true

            # ==================== Service-Prefix Routes (Swagger Try-it-out) ====================
            - id: auth-proxy
              uri: ${gateway.services.auth}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false

            - id: product-proxy
              uri: ${gateway.services.product}
              predicates:
                - Path=/product/**
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false

            - id: point-proxy
              uri: ${gateway.services.point}
              predicates:
                - Path=/point/**
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false

            - id: order-proxy
              uri: ${gateway.services.order}
              predicates:
                - Path=/order/**
              filters:
                - StripPrefix=1
              metadata:
                auth-required: false

# SpringDoc - Swagger aggregation for all backend services
springdoc:
  swagger-ui:
    urls:
      - name: auth
        url: /v3/api-docs/auth
      - name: product
        url: /v3/api-docs/product
      - name: point
        url: /v3/api-docs/point
      - name: order
        url: /v3/api-docs/order
