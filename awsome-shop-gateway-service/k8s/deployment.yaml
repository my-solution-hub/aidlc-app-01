apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: awsome-shop
  labels:
    app: gateway-service
    app.kubernetes.io/part-of: awsome-shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
      annotations:
        # CW Application Signals webhook defaults all 4 language agents
        # to "true". Force-disable the non-Java ones so init containers
        # for nodejs/python/dotnet are skipped (saves ~5-10s pod start).
        instrumentation.opentelemetry.io/inject-java: "true"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      serviceAccountName: awsome-shop-sa
      containers:
        - name: gateway-service
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8088
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:8001"
            - name: PRODUCT_SERVICE_URL
              value: "http://product-service:8002"
            - name: POINTS_SERVICE_URL
              value: "http://points-service:8003"
            - name: ORDER_SERVICE_URL
              value: "http://order-service:8004"
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: redis-host
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: shared-config
                  key: redis-port
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8088
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8088
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: awsome-shop
  labels:
    app: gateway-service
spec:
  selector:
    app: gateway-service
  ports:
    - port: 8088
      targetPort: 8088
      protocol: TCP
  type: ClusterIP
