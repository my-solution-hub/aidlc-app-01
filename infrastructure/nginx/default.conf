# AWSomeShop frontend nginx config
#
# The React app's axios client issues SAME-ORIGIN requests with these path
# prefixes (see src/services/api/*.ts): /auth, /product, /point, /order.
# These map to the gateway's "*-proxy" routes (StripPrefix=1). nginx proxies
# them — plus the Swagger aggregation endpoints — to the API gateway.
#
# NOTE: the gateway listens on internal port 8081 (docker profile forces
# server.port=8081 for every service).

upstream gateway {
    server gateway-service:8081;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Health check endpoint
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }

    # ---- API reverse proxy: service-prefix routes -> gateway ----
    location ~ ^/(auth|product|point|order)/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        client_max_body_size 10m;
    }

    # ---- Swagger aggregation (optional, served via gateway) ----
    location /v3/api-docs {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- Static assets: no cache during development ----
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
